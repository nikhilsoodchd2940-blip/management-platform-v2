name: Deploy

# Deliberately manual-only (workflow_dispatch), not triggered by push —
# unlike ci.yml, a deploy has real consequences (moves live traffic) and
# depends on secrets that don't exist until someone sets them up in this
# repo's Settings > Secrets. See docs/LAUNCH_CHECKLIST.md for exactly
# which secrets each job needs and where to get them. Until those are
# configured, running this workflow will fail at the auth step, not
# silently do the wrong thing.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        type: choice
        options:
          - functions-and-rules
          - admin-web
          - both
        default: both
      environment:
        description: 'Firebase project alias (dev/staging/prod — see firebase/.firebaserc)'
        required: true
        type: choice
        options: [dev, staging, prod]
        default: staging

jobs:
  deploy-functions:
    if: ${{ inputs.target == 'functions-and-rules' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
        working-directory: firebase/functions
      - run: npm run build
        working-directory: firebase/functions
      # FIREBASE_TOKEN: generate with `firebase login:ci` on a trusted
      # machine, store as a repo secret. Deploys Functions + Firestore
      # rules/indexes + Storage rules together so they never drift apart
      # mid-deploy.
      - run: npx firebase-tools deploy --project ${{ inputs.environment }} --only functions,firestore:rules,firestore:indexes,storage --token "$FIREBASE_TOKEN" --non-interactive
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-admin-web:
    if: ${{ inputs.target == 'admin-web' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        working-directory: admin-web
      # VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID: from the Vercel
      # dashboard for this project, or swap this step for Firebase
      # Hosting if that's the chosen host instead — either is a
      # reasonable choice the blueprint doesn't pin down, so this
      # workflow shows one concrete option rather than guessing.
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: admin-web
          vercel-args: ${{ inputs.environment == 'prod' && '--prod' || '' }}
