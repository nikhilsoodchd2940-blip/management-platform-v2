name: management_platform
description: Member + Host mobile app (Management & Group Operations Platform)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.1.4
  url_launcher: ^6.3.0       # Phase 6: mailto:/tel: from the registration mismatch screen's "Contact Admin"
  qr_flutter: ^4.1.0        # Phase 1: display personal QR
  mobile_scanner: ^5.2.3    # Phase 2: Host QR scanning
  geolocator: ^13.0.1       # Phase 2: device GPS reading (hint only — see docs/QR_DATAFLOW.md)
  google_maps_flutter: ^2.9.0 # Phase 2: event location display
  go_router: ^14.2.3
  flutter_riverpod: ^2.5.1
  flutter_stripe: ^11.1.0
  intl_phone_field: ^3.2.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  firebase_app_check: ^0.3.2+10
  firebase_crashlytics: ^4.1.3
  cached_network_image: ^3.4.1  # disk+memory cache for banner images — Image.network was re-downloading every app open

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/